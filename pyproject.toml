[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tube-ultimate-player"
version = "0.2.19"
description = "Tube Ultimate Player"
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
    "PySide6",
    "yt-dlp",
    "python-mpv"
]

[project.scripts]
tube-ultimate-player = "main:main"
